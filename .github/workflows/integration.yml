name: Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  integration-gate:
    name: Integration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADING_OWNER_ROOT: ${{ github.workspace }}/owners
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Checkout agentic-base owner bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-base
          ref: 6d90bd812169bde115e3c927c0919d6bacfd8872
          path: owners/agentic-base
          fetch-depth: 1

      - name: Checkout agentic-sheets owner bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-sheets
          ref: 349b43ccadbec4edf107cfef9f0c09fc1715f9f2
          path: owners/agentic-sheets
          fetch-depth: 1

      - name: Checkout agentic-design-system owner bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-design-system
          ref: d60b569179c23a14418616abc265d22f2da00e30
          path: owners/agentic-design-system
          fetch-depth: 1

      - name: Checkout agentic-os owner bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-os
          ref: eed72ec7597c94c95669cb537dda81c59596a0ed
          path: owners/agentic-os
          fetch-depth: 1

      - name: Checkout agentic-commerce-os owner bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-commerce-os
          ref: aa4151f82816c0e18796549a2be0e861d0e772d7
          path: owners/agentic-commerce-os
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Check runtime
        run: npm run check:runtime
