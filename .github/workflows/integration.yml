name: Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  integration-gate:
    name: Integration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADING_OWNER_ROOT: ${{ github.workspace }}/owners
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Read pinned owner revisions
        id: owners
        run: |
          pins=$(jq -ce 'select(all(.[]; type == "string" and test("^[0-9a-f]{40}$")))' scripts/owner-revisions.json)
          echo "pins=$pins" >> "$GITHUB_OUTPUT"

      - name: Checkout agentic-base owner bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-base
          ref: ${{ fromJSON(steps.owners.outputs.pins)['agentic-base'] }}
          path: owners/agentic-base
          fetch-depth: 1

      - name: Checkout agentic-sheets owner bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-sheets
          ref: ${{ fromJSON(steps.owners.outputs.pins)['agentic-sheets'] }}
          path: owners/agentic-sheets
          fetch-depth: 1

      - name: Checkout agentic-design-system owner bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-design-system
          ref: ${{ fromJSON(steps.owners.outputs.pins)['agentic-design-system'] }}
          path: owners/agentic-design-system
          fetch-depth: 1

      - name: Checkout agentic-os owner bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-os
          ref: ${{ fromJSON(steps.owners.outputs.pins)['agentic-os'] }}
          path: owners/agentic-os
          fetch-depth: 1

      - name: Checkout agentic-commerce-os owner bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-commerce-os
          ref: ${{ fromJSON(steps.owners.outputs.pins)['agentic-commerce-os'] }}
          path: owners/agentic-commerce-os
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Qualify registered fleet reuse
        uses: huijoohwee/agentic-os/.github/actions/fleet-reuse@3ed239e9f3591ade6bfb84b5262e2c0487bd7039

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Check runtime
        run: npm run check:runtime
