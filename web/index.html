<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Decision journal · Agentic Trading</title>
  <link rel="icon" href="./owners/design/site/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./owners/design/profile.css">
  <link rel="stylesheet" href="./owners/design/site/collection-layout.css">
  <link rel="stylesheet" href="./journal.css">
  <script type="module" src="./src/browser.mjs"></script>
</head>
<body>
  <main id="journal" aria-label="Decision journal">
    <noscript>Enable JavaScript to open the offline trading journal.</noscript>
  </main>
  <template id="session-slot">
    <div class="session"><strong>Agentic Trading</strong><span id="offline-status" role="status">Opening local workspace…</span></div>
  </template>
  <template id="age-slot">
    <div class="measure"><div><span>Quote age</span><strong id="age" class="agentic-mono">—</strong></div>
    <progress id="window" aria-label="Quote age within the five-minute policy window" value="0" max="300"></progress>
    <div class="scale agentic-mono"><span>0 s</span><span>5 min threshold</span></div></div>
  </template>
  <template id="quote-slot">
    <section id="quote" aria-labelledby="check-heading">
      <div id="verdict" aria-live="polite" aria-atomic="true"><strong id="state">Checking…</strong>
        <p id="reason"></p></div>

      <dl class="facts"><div><dt>Symbol</dt><dd class="agentic-mono" id="quote-symbol">—</dd></div>
        <div><dt>Synthetic quote</dt><dd class="agentic-mono" id="quote-price">—</dd></div>
        <div><dt>Observed at</dt><dd class="agentic-mono" id="observed">—</dd></div>
        <div><dt>Policy revision</dt><dd class="agentic-mono" id="policy">—</dd></div></dl>
      <p>R01 checks the quote timestamp. The ticket stays a draft.</p>
    </section>
  </template>
  <template id="ticket-slot">
    <form id="ticket" aria-labelledby="ticket-heading" class="agentic-form-controls">
      <fieldset id="fields" disabled><legend class="sr">Ticket inputs</legend>
        <div class="pair"><div class="field"><label for="side">Side</label><select id="side" name="side"><option value="BUY">Buy</option><option value="SELL">Sell</option></select></div>
          <div class="field"><label for="quantity">Quantity</label><input id="quantity" type="number" name="quantity" step="any" min="0" required></div></div>
        <div class="field"><label for="limit-price">Limit price (USD)</label><input id="limit-price" type="number" name="limitPrice" step="any" min="0" required></div>
        <div class="field"><label for="metadata">Quote metadata</label><select id="metadata" name="metadata"><option value="as-received">As received · realtime</option>
          <option value="missing">Freshness class missing</option></select></div>
        <label for="evaluation-time">Evaluation time (UTC)</label>
        <div class="time-row"><input id="evaluation-time" name="evaluationTime" type="time" step="1" required>
          <button id="advance" type="button" class="agentic-form-control">Advance 1 s</button></div>
        <div class="agentic-dashboard-actions"><button id="save" type="submit" class="agentic-form-control">Save draft</button>
          <button id="reopen" type="button" class="agentic-form-control" hidden>Load saved revision</button></div>
      </fieldset>
      <p id="feedback" role="status"></p>
    </form>
  </template>
  <template id="saved-slot">
    <p id="empty">Save a draft to keep its inputs and source revision on this device.</p>
    <div id="record" role="region" aria-labelledby="saved-heading" hidden><dl class="facts"><div><dt>Ticket</dt><dd class="agentic-mono" id="saved-ticket"></dd></div>
      <div><dt>Limit price</dt><dd class="agentic-mono" id="saved-price"></dd></div><div><dt>Evaluation (UTC)</dt><dd class="agentic-mono" id="saved-time"></dd></div>
      <div><dt>R01 result</dt><dd class="agentic-mono" id="saved-result"></dd></div></dl>
    </div>
  </template>
  <template id="evidence-slot">
    <details id="audit" data-dashboard-primitive="disclosure"><summary>Private cash-policy audit · synthetic fixture</summary>
      <p id="audit-status" role="status">Opening the fixture…</p>
      <dl class="facts" id="audit-results"></dl>
      <fieldset id="audit-files" disabled class="agentic-form-controls"><legend>Manual synthetic runs</legend>
        <label for="audit-input">Paste snapshot JSON</label><textarea id="audit-input" rows="3"></textarea>
        <div class="agentic-dashboard-actions">
          <button type="button" id="audit-accept">Import run</button>
          <button type="button" id="audit-export">Export audit</button>
          <button type="button" id="audit-witness">Save witness</button>
        </div>
        <label>Audit archive<input type="file" accept=".json" id="audit-archive"></label>
        <label>Retained witness<input type="file" accept=".json" id="audit-proof"></label>
        <button type="button" id="audit-restore">Verify and restore</button>
      </fieldset>
      <p id="audit-feedback" role="status"></p>
    </details>
    <details id="rehearsal" data-dashboard-primitive="disclosure"><summary>Moomoo × Qoder competition rehearsal</summary>
      <div id="rehearsal-body"><p role="status">Opening the offline rehearsal…</p></div>
    </details>
    <details id="evidence" hidden data-dashboard-primitive="disclosure"><summary>Source evidence and calculation</summary>
      <dl class="facts"><div><dt>Fixture ID</dt><dd class="agentic-mono" id="fixture-id"></dd></div>
      <div><dt>Policy</dt><dd class="agentic-mono" id="saved-policy"></dd></div><div><dt>Fixture SHA-256</dt><dd class="agentic-mono" id="digest"></dd></div></dl>
      <p id="notional" role="status"></p>
    </details>
  </template>
  <div id="fatal" role="alert" hidden></div>
</body>
</html>
