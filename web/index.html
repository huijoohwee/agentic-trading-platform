<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Decision journal · Agentic Trading</title>
  <link rel="icon" href="./owners/design/site/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./owners/design/profile.css">
  <link rel="stylesheet" href="./owners/design/site/collection-layout.css">
  <link rel="stylesheet" href="./owners/design/site/toolbar.css">
  <link rel="stylesheet" href="./trading.css">
  <link rel="stylesheet" href="./journal.css">
  <script type="module" src="./src/landing-tools.mjs"></script>
  <script type="module" src="./src/browser.mjs"></script>
  <script type="module" src="./src/skills-toolbar.mjs"></script>
</head>
<body data-agentic-typography>
  <!-- trading-toolbar -->
  <main id="journal" aria-label="Decision journal">
    <noscript>Enable JavaScript to open the offline trading journal.</noscript>
  </main>
  <template id="session-slot">
    <div class="session"><strong>Agentic Trading</strong><span id="offline-status" class="agentic-text-detail" role="status">Opening local workspace…</span></div>
  </template>
  <template id="age-slot">
    <div class="measure"><div><span>Quote age</span><strong id="age" class="agentic-mono-detail">—</strong></div>
    <progress id="window" aria-label="Quote age within the five-minute policy window" value="0" max="300"></progress>
    <div class="scale agentic-mono-detail"><span>0 s</span><span>5 min threshold</span></div></div>
  </template>
  <template id="quote-slot">
    <section id="quote" aria-labelledby="check-heading">
      <div id="verdict" aria-live="polite" aria-atomic="true"><strong id="state">Checking…</strong>
        <p id="reason"></p></div>

      <dl class="facts"><div><dt>Symbol</dt><dd id="quote-symbol">—</dd></div>
        <div><dt>Synthetic quote</dt><dd id="quote-price">—</dd></div>
        <div><dt>Observed at</dt><dd id="observed">—</dd></div>
        <div><dt>Policy revision</dt><dd id="policy">—</dd></div></dl>
      <p>R01 checks the quote timestamp. The ticket stays a draft.</p>
    </section>
  </template>
  <template id="ticket-slot">
    <form id="ticket" aria-labelledby="ticket-heading" class="agentic-form-controls">
      <fieldset id="fields" disabled><legend class="sr">Ticket inputs</legend>
        <div class="pair"><div class="field"><label for="side">Side</label><select id="side" name="side"><option value="BUY">Buy</option><option value="SELL">Sell</option></select></div>
          <div class="field"><label for="quantity">Quantity</label><input id="quantity" type="number" name="quantity" step="any" min="0" required></div></div>
        <div class="field"><label for="limit-price">Limit price (USD)</label><input id="limit-price" type="number" name="limitPrice" step="any" min="0" required></div>
        <div class="field"><label for="metadata">Quote metadata</label><select id="metadata" name="metadata"><option value="as-received">As received · realtime</option>
          <option value="missing">Freshness class missing</option></select></div>
        <label for="evaluation-time">Evaluation time (UTC)</label>
        <div class="time-row"><input id="evaluation-time" name="evaluationTime" type="time" step="1" required>
          <button id="advance" type="button" class="agentic-form-control">Advance 1 s</button></div>
        <div class="agentic-dashboard-actions"><button id="save" type="submit" class="agentic-form-control">Save draft</button>
          <button id="reopen" type="button" class="agentic-form-control" hidden>Load saved revision</button></div>
      </fieldset>
      <p id="feedback" role="status"></p>
    </form>
  </template>
  <template id="saved-slot">
    <p id="empty">Save a draft to keep its inputs and source revision on this device.</p>
    <div id="record" role="region" aria-labelledby="saved-heading" hidden><dl class="facts"><div><dt>Ticket</dt><dd id="saved-ticket"></dd></div>
      <div><dt>Limit price</dt><dd id="saved-price"></dd></div><div><dt>Evaluation (UTC)</dt><dd id="saved-time"></dd></div>
      <div><dt>R01 result</dt><dd id="saved-result"></dd></div></dl>
    </div>
  </template>
  <template id="evidence-slot">
    <nav class="journal-sections-nav agentic-dashboard-actions" aria-label="Journal sections">
      <a href="#provider-desk">Market desk</a>
      <a href="#provider-coverage">Provider routes</a>
      <a href="#provider-capture">Desktop capture</a>
      <a href="#provider-hosted">Hosted capture</a>
      <a href="#rehearsal">Competition rehearsal</a>
      <a href="#runtime-readback">Runtime readback</a>
      <a href="#audit">Cash-policy audit</a>
      <a href="#evidence">Source evidence</a>
    </nav>
    <section class="journal-section" id="provider-desk" aria-labelledby="provider-desk-heading"><h2 id="provider-desk-heading">Moomoo market desk · quote board, order book, tape, candles ($0 replay)</h2>
      <div id="desk-body"><p role="status">Loading this section…</p></div>
    </section>
    <section class="journal-section" id="provider-coverage" aria-labelledby="provider-coverage-heading"><h2 id="provider-coverage-heading">Moomoo OpenAPI coverage · evidence-led feature families</h2>
      <div id="coverage-body"><p role="status">Loading this section…</p></div>
    </section>
    <section class="journal-section" id="provider-capture" aria-labelledby="provider-capture-heading"><h2 id="provider-capture-heading">Moomoo Desktop capture · entitled $0 quote replay</h2>
      <div id="capture-body"><p role="status">Loading this section…</p></div>
    </section>
    <section class="journal-section" id="provider-hosted" aria-labelledby="provider-hosted-heading"><h2 id="provider-hosted-heading">Moomoo hosted OAuth capture · entitled $0 read.ticker (N3 qualified)</h2>
      <div id="hosted-body"><p role="status">Loading this section…</p></div>
    </section>
    <section class="journal-section" id="rehearsal" aria-labelledby="rehearsal-heading"><h2 id="rehearsal-heading">Moomoo × Qoder competition rehearsal</h2>
      <div id="rehearsal-body"><p role="status">Opening the offline rehearsal…</p></div>
    </section>
    <section class="journal-section" id="runtime-readback" aria-labelledby="runtime-readback-heading"><h2 id="runtime-readback-heading">Runtime readback · private SIMULATE observations</h2>
      <div id="runtime-body"><p role="status">Loading this section…</p></div>
    </section>
    <section class="journal-section" id="audit" aria-labelledby="audit-heading"><h2 id="audit-heading">Private cash-policy audit · synthetic fixture</h2>
      <p id="audit-status" role="status">Opening the fixture…</p>
      <dl class="facts" id="audit-results"></dl>
      <fieldset id="audit-files" disabled class="agentic-form-controls"><legend>Manual synthetic runs</legend>
        <label for="audit-input">Paste snapshot JSON</label><textarea id="audit-input" rows="3"></textarea>
        <div class="agentic-dashboard-actions">
          <button type="button" id="audit-accept">Import run</button>
          <button type="button" id="audit-export">Export audit</button>
          <button type="button" id="audit-witness">Save witness</button>
        </div>
        <label>Audit archive<input type="file" accept=".json" id="audit-archive"></label>
        <label>Retained witness<input type="file" accept=".json" id="audit-proof"></label>
        <button type="button" id="audit-restore">Verify and restore</button>
      </fieldset>
      <p id="audit-feedback" role="status"></p>
    </section>
    <section class="journal-section" id="evidence" aria-labelledby="evidence-heading"><h2 id="evidence-heading">Source evidence and calculation</h2>
      <p id="evidence-empty">Save a draft to see its source and calculation.</p>
      <dl class="facts" id="evidence-facts" hidden><div><dt>Fixture ID</dt><dd id="fixture-id"></dd></div>
      <div><dt>Policy</dt><dd id="saved-policy"></dd></div><div><dt>Fixture SHA-256</dt><dd id="digest"></dd></div></dl>
      <p id="notional" role="status"></p>
    </section>
  </template>
  <div id="fatal" role="alert" hidden></div>
</body>
</html>
